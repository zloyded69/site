<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обо мне — доска</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cork-a:#c9a06a;
    --cork-b:#a97f4f;
    --ink:#3a2c22;
    --paper:#fffdf7;
    --pin-shadow: rgba(0,0,0,.35);
    --note-1:#f6e39a; /* butter */
    --note-2:#f3b6a6; /* peach */
    --note-3:#c9e4c5; /* mint */
    --note-4:#bcd8e8; /* sky */
    --note-5:#e3c6e8; /* lilac */
    --note-6:#f2a6b8; /* rose */
    --note-7:#d8c39a; /* sand */
    --note-8:#a6d8cf; /* teal-mint */
    --note-9:#e8d0f2; /* light purple */
    --accent:#d1495b;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    font-family:'Manrope', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 20% 20%, rgba(0,0,0,.05) 0, transparent 3%),
      radial-gradient(circle at 70% 60%, rgba(0,0,0,.05) 0, transparent 3%),
      radial-gradient(circle at 40% 80%, rgba(0,0,0,.05) 0, transparent 3%),
      radial-gradient(circle at 85% 15%, rgba(0,0,0,.05) 0, transparent 3%),
      linear-gradient(135deg, var(--cork-a), var(--cork-b));
    background-blend-mode: multiply, multiply, multiply, multiply, normal;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 20px 80px;
  }

  header{
    text-align:center;
    margin-bottom:40px;
  }

  h1{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:64px;
    color:var(--paper);
    margin:0;
    text-shadow: 2px 2px 0 rgba(0,0,0,.25);
    transform:rotate(-2deg);
  }

  p.sub{
    font-size:15px;
    font-weight:600;
    color:var(--paper);
    opacity:.85;
    margin:6px 0 0;
    letter-spacing:.3px;
  }

  .board{
    display:grid;
    grid-template-columns:repeat(3, minmax(160px, 220px));
    gap:34px 28px;
    perspective:1600px;
  }

  .card{
    position:relative;
    width:100%;
    aspect-ratio:3/4;
    transform-style:preserve-3d;
    -webkit-transform-style:preserve-3d;
    transition:transform .7s cubic-bezier(.2,.8,.2,1);
    cursor:pointer;
    outline-offset:6px;
  }
  .card:focus-visible{ outline:3px solid var(--paper); }

  .card.flipped{ transform: rotateY(180deg); }

  .card .rot{
    position:absolute; inset:0;
    transform-style:preserve-3d;
  }

  /* slight hand-placed tilt per card, cancelled out for flip math by wrapping */
  .card:nth-child(1) .rot{ transform:rotate(-3deg); }
  .card:nth-child(2) .rot{ transform:rotate(2deg); }
  .card:nth-child(3) .rot{ transform:rotate(-2deg); }
  .card:nth-child(4) .rot{ transform:rotate(2.5deg); }
  .card:nth-child(5) .rot{ transform:rotate(-1.5deg); }
  .card:nth-child(6) .rot{ transform:rotate(3deg); }
  .card:nth-child(7) .rot{ transform:rotate(-2.5deg); }
  .card:nth-child(8) .rot{ transform:rotate(1.5deg); }
  .card:nth-child(9) .rot{ transform:rotate(-3deg); }

  .face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:6px;
    box-shadow:0 10px 20px rgba(0,0,0,.35), 0 2px 4px rgba(0,0,0,.2);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  .front{
    background:var(--note-color, var(--note-1));
    background-image: linear-gradient(rgba(255,255,255,.15), rgba(255,255,255,0));
  }

  .front .label{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:34px;
    text-align:center;
    padding:0 10px;
  }

  .front .hint{
    font-size:11px;
    font-weight:600;
    opacity:.6;
    margin-top:6px;
    text-transform:uppercase;
    letter-spacing:.6px;
  }

  .pin{
    position:absolute;
    top:-10px; left:50%;
    transform:translateX(-50%);
    width:18px; height:18px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--accent) 60%, #7a1f2b 100%);
    box-shadow:0 4px 6px var(--pin-shadow);
    z-index:3;
  }

  .back{
    background:var(--paper);
    transform:rotateY(180deg);
    padding:12px 12px 24px;
    justify-content:flex-start;
  }

  .photo-slot{
    width:100%;
    flex:1;
    border-radius:2px;
    border:2px dashed #d8cfc0;
    background:#faf7f0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:12px;
    color:#8a7f6d;
    font-weight:600;
    overflow:hidden;
    position:relative;
    cursor:pointer;
  }

  .photo-slot img{
    position:absolute;
    inset:0;
    width:100%; height:100%;
    object-fit:cover;
    opacity:0;
    filter:brightness(2) contrast(0) blur(6px);
    transform:scale(1.08);
    transition:opacity 1s ease, filter 1.1s ease, transform 1.1s ease;
    pointer-events:none;
  }
  .photo-slot .placeholder-text{
    position:relative;
    z-index:1;
    pointer-events:none;
  }

  .photo-slot img.developed{
    opacity:1;
    filter:brightness(1) contrast(1) blur(0);
    transform:scale(1);
  }

  .caption{
    margin-top:8px;
    width:100%;
    border:none;
    background:transparent;
    font-family:'Caveat', cursive;
    font-size:20px;
    text-align:center;
    color:var(--ink);
    outline:none;
    border-bottom:1px solid transparent;
  }
  .caption:focus{ border-bottom:1px solid #d8cfc0; }

  .back .tag{
    position:absolute;
    top:6px; right:8px;
    font-family:'Caveat', cursive;
    font-size:18px;
    color:#b0a68f;
    z-index:2;
  }

  .flip-back{
    position:absolute;
    top:4px; left:6px;
    z-index:2;
    width:26px; height:26px;
    border-radius:50%;
    border:1px solid #d8cfc0;
    background:#fff;
    color:var(--ink);
    font-size:14px;
    line-height:1;
    cursor:pointer;
  }

  .upload-btn{
    margin-top:8px;
    width:100%;
    padding:8px 6px;
    border:none;
    border-radius:6px;
    background:var(--accent);
    color:#fff;
    font-family:'Manrope', sans-serif;
    font-weight:800;
    font-size:12px;
    letter-spacing:.2px;
    cursor:pointer;
  }
  .upload-btn:active{ transform:scale(.97); }

  input[type="file"]{
    position:absolute;
    width:1px; height:1px;
    padding:0; margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

  footer{
    margin-top:44px;
    color:var(--paper);
    opacity:.75;
    font-size:12px;
    font-weight:600;
    text-align:center;
  }

  .owner-bar{
    margin-top:10px;
    font-size:12px;
    color:var(--paper);
    opacity:.7;
  }
  .owner-bar button{
    background:none;
    border:none;
    color:var(--paper);
    text-decoration:underline;
    cursor:pointer;
    font-size:12px;
    font-weight:600;
    padding:0;
  }
  .owner-badge{
    font-weight:800;
    opacity:1;
  }

  .status-msg{
    color:var(--paper);
    font-size:13px;
    font-weight:600;
    margin-bottom:20px;
    opacity:.85;
  }

  .caption[disabled]{
    cursor:default;
  }
  .caption[disabled]::placeholder{ color:transparent; }

  .upload-btn.hidden, .flip-back.hidden{ display:none; }
  .photo-slot.readonly{ cursor:default; }

  @media (max-width:640px){
    h1{ font-size:44px; }
    .board{ grid-template-columns:repeat(3, minmax(90px, 1fr)); gap:20px 14px; }
    .front .label{ font-size:20px; }
    .front .hint{ display:none; }
    .caption{ font-size:15px; }
  }

  @media (prefers-reduced-motion: reduce){
    .card, .photo-slot img{ transition:none !important; }
  }
</style>
</head>
<body>

<header>
  <h1>Обо мне</h1>
  <p class="sub">нажми на карточку — переверни — добавь фото</p>
</header>

<p class="status-msg" id="statusMsg">Загружаем фото…</p>

<div class="board" id="board"></div>

<div class="owner-bar" id="ownerBar"></div>

<footer>сделано для доски «узнай меня получше»</footer>

<script>
  // Change this to whatever passphrase only you should know.
  const OWNER_PIN = "2609";

  const categories = [
    "Цвет","Место","Еда",
    "Напиток","Хобби","Машина",
    "Цветы","Животное","Персонаж"
  ];
  const noteColors = [
    "var(--note-1)","var(--note-2)","var(--note-3)",
    "var(--note-4)","var(--note-5)","var(--note-6)",
    "var(--note-7)","var(--note-8)","var(--note-9)"
  ];

  const board = document.getElementById('board');
  const statusMsg = document.getElementById('statusMsg');
  const ownerBar = document.getElementById('ownerBar');

  const hasStorage = !!(window.storage && typeof window.storage.get === 'function');
  let isOwner = false;

  async function loadOwnerFlag(){
    if (!hasStorage) return false;
    try{
      const r = await window.storage.get('owner-flag', false);
      return !!(r && r.value === 'true');
    }catch(e){ return false; }
  }

  async function setOwnerFlag(v){
    if (!hasStorage) return;
    try{ await window.storage.set('owner-flag', v ? 'true' : 'false', false); }catch(e){}
  }

  async function loadCard(i){
    if (!hasStorage) return null;
    try{
      const r = await window.storage.get('card-' + i, true);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  }

  async function saveCard(i, data){
    if (!hasStorage) return;
    try{ await window.storage.set('card-' + i, JSON.stringify(data), true); }
    catch(e){ alert('Не получилось сохранить фото. Попробуй фото поменьше.'); }
  }

  function compressImage(file, maxDim, quality){
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = (e) => { img.src = e.target.result; };
      reader.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim){ height *= maxDim / width; width = maxDim; }
        else if (height > maxDim){ width *= maxDim / height; height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function renderOwnerBar(){
    ownerBar.innerHTML = isOwner
      ? `<span class="owner-badge">Режим автора включён ✓</span> · <button type="button" id="logoutBtn">выйти в режим гостя</button>`
      : `<button type="button" id="ownerBtn">Я автор доски</button>`;

    const ownerBtn = document.getElementById('ownerBtn');
    if (ownerBtn) ownerBtn.addEventListener('click', async () => {
      const entered = prompt('Введи пароль автора:');
      if (entered === null) return;
      if (entered === OWNER_PIN){
        isOwner = true;
        await setOwnerFlag(true);
        renderOwnerBar();
        rebuildCardPermissions();
      } else {
        alert('Неверный пароль.');
      }
    });

    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) logoutBtn.addEventListener('click', async () => {
      isOwner = false;
      await setOwnerFlag(false);
      renderOwnerBar();
      rebuildCardPermissions();
    });
  }

  const cardRefs = [];

  function applyPermissions(refs){
    const { uploadBtn, slot, caption } = refs;
    if (isOwner){
      uploadBtn.classList.remove('hidden');
      slot.classList.remove('readonly');
      caption.removeAttribute('disabled');
    } else {
      uploadBtn.classList.add('hidden');
      slot.classList.add('readonly');
      caption.setAttribute('disabled', 'true');
    }
  }

  function rebuildCardPermissions(){
    cardRefs.forEach(applyPermissions);
  }

  function playDevelop(img, placeholderText){
    placeholderText.style.display = 'none';
    img.classList.remove('developed');
    void img.offsetWidth;
    requestAnimationFrame(() => img.classList.add('developed'));
  }

  function setPhotoSilently(img, placeholderText, src){
    if (!src) return;
    if (img.src === src) return;
    img.src = src;
    placeholderText.style.display = 'none';
    img.classList.add('developed');
  }

  async function init(){
    isOwner = await loadOwnerFlag();
    renderOwnerBar();

    categories.forEach((label, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.tabIndex = 0;
      card.setAttribute('role','button');
      card.setAttribute('aria-label', 'Карточка: ' + label);

      card.innerHTML = `
        <div class="rot">
          <div class="face front" style="--note-color:${noteColors[i]}">
            <div class="pin"></div>
            <div class="label">${label}</div>
            <div class="hint">нажми, чтобы открыть</div>
          </div>
          <div class="face back">
            <span class="tag">#${i+1}</span>
            <button type="button" class="flip-back" aria-label="Перевернуть обратно">↩</button>
            <div class="photo-slot">
              <span class="placeholder-text">пока нет фото</span>
              <img alt="${label}">
            </div>
            <button type="button" class="upload-btn">📷 Добавить фото</button>
            <input type="text" class="caption" placeholder="подпись...">
            <input type="file" accept="image/*">
          </div>
        </div>
      `;

      const img = card.querySelector('img');
      const fileInput = card.querySelector('input[type="file"]');
      const slot = card.querySelector('.photo-slot');
      const placeholderText = card.querySelector('.placeholder-text');
      const caption = card.querySelector('.caption');
      const uploadBtn = card.querySelector('.upload-btn');
      const flipBackBtn = card.querySelector('.flip-back');
      const front = card.querySelector('.front');

      const refs = { uploadBtn, slot, caption };
      cardRefs.push(refs);
      applyPermissions(refs);

      front.addEventListener('click', () => card.classList.add('flipped'));
      front.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          card.classList.add('flipped');
        }
      });

      uploadBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!isOwner) return;
        fileInput.click();
      });
      slot.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!isOwner) return;
        fileInput.click();
      });

      flipBackBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        card.classList.remove('flipped');
      });
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') card.classList.remove('flipped');
      });

      caption.addEventListener('click', (e) => e.stopPropagation());
      fileInput.addEventListener('click', (e) => e.stopPropagation());

      caption.addEventListener('change', async () => {
        if (!isOwner) return;
        await saveCard(i, { image: img.src && img.src.startsWith('data:') ? img.src : null, caption: caption.value });
      });

      fileInput.addEventListener('change', async () => {
        if (!isOwner) return;
        const file = fileInput.files[0];
        if (!file) return;
        try{
          const dataUrl = await compressImage(file, 900, 0.82);
          img.src = dataUrl;
          playDevelop(img, placeholderText);
          await saveCard(i, { image: dataUrl, caption: caption.value });
        }catch(e){
          alert('Не получилось загрузить это фото, попробуй другое.');
        }
      });

      board.appendChild(card);
    });

    // Load existing shared photos
    const results = await Promise.all(categories.map((_, i) => loadCard(i)));
    results.forEach((data, i) => {
      if (!data) return;
      const card = board.children[i];
      const img = card.querySelector('img');
      const placeholderText = card.querySelector('.placeholder-text');
      const caption = card.querySelector('.caption');
      if (data.image) setPhotoSilently(img, placeholderText, data.image);
      if (data.caption) caption.value = data.caption;
    });

    statusMsg.style.display = 'none';

    if (hasStorage){
      // Guests quietly pick up new photos the owner adds, without reloading the page.
      setInterval(async () => {
        if (isOwner) return;
        const fresh = await Promise.all(categories.map((_, i) => loadCard(i)));
        fresh.forEach((data, i) => {
          if (!data) return;
          const card = board.children[i];
          const img = card.querySelector('img');
          const placeholderText = card.querySelector('.placeholder-text');
          const caption = card.querySelector('.caption');
          if (data.image) setPhotoSilently(img, placeholderText, data.image);
          if (data.caption && document.activeElement !== caption) caption.value = data.caption;
        });
      }, 7000);
    } else {
      statusMsg.style.display = 'block';
      statusMsg.textContent = 'Общий просмотр фото работает только когда страница открыта как живой артефакт в Claude, а не как скачанный файл.';
    }
  }

  init();
</script>

</body>
</html>
